<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کیف کارت بلو — انیمیشن سه‌بعدی</title>
    <link rel="preload" href="/fonts/Ravi-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/toggle.css" />
  </head>
  <body class="is-day preload">
    <canvas id="scene" tabindex="0" role="button" aria-pressed="false" aria-label="کیف کارت بلو — برای باز و بسته کردن کلیک کنید"></canvas>

    <header class="top">
      <!-- Light/dark switch: sun = light page + black wallet (default), moon = dark page + white wallet. -->
      <button class="toggle" type="button" role="switch" aria-checked="false" aria-label="حالت تیره">
        <span class="pill">
          <span class="layer sky-night"></span>

          <!-- Stars: sparkles + tiny dots. Outer <g> places each star; inner .star animates.
               --i staggers the entry, --t sets twinkle speed. -->
          <svg class="layer stars" viewBox="0 0 530 243" aria-hidden="true">
            <g transform="translate(70 70) scale(7)"><g class="star" style="--i:0;--t:3.2s"><path d="M0 -1 Q0.12 -0.12 1 0 Q0.12 0.12 0 1 Q-0.12 0.12 -1 0 Q-0.12 -0.12 0 -1Z"/></g></g>
            <g transform="translate(160 92) scale(5)"><g class="star" style="--i:1;--t:2.6s"><path d="M0 -1 Q0.12 -0.12 1 0 Q0.12 0.12 0 1 Q-0.12 0.12 -1 0 Q-0.12 -0.12 0 -1Z"/></g></g>
            <g transform="translate(232 72) scale(6)"><g class="star" style="--i:2;--t:3.8s"><path d="M0 -1 Q0.12 -0.12 1 0 Q0.12 0.12 0 1 Q-0.12 0.12 -1 0 Q-0.12 -0.12 0 -1Z"/></g></g>
            <g transform="translate(250 160) scale(8)"><g class="star" style="--i:3;--t:3.1s"><path d="M0 -1 Q0.12 -0.12 1 0 Q0.12 0.12 0 1 Q-0.12 0.12 -1 0 Q-0.12 -0.12 0 -1Z"/></g></g>
            <g transform="translate(120 175) scale(5)"><g class="star" style="--i:4;--t:2.9s"><path d="M0 -1 Q0.12 -0.12 1 0 Q0.12 0.12 0 1 Q-0.12 0.12 -1 0 Q-0.12 -0.12 0 -1Z"/></g></g>
            <g transform="translate(48 130)"><g class="star" style="--i:5;--t:2.2s"><circle r="2.4"/></g></g>
            <g transform="translate(110 40)"><g class="star" style="--i:6;--t:2.7s"><circle r="1.8"/></g></g>
            <g transform="translate(200 130)"><g class="star" style="--i:7;--t:3.4s"><circle r="2.2"/></g></g>
            <g transform="translate(296 108)"><g class="star" style="--i:8;--t:2.4s"><circle r="1.6"/></g></g>
            <g transform="translate(180 205)"><g class="star" style="--i:9;--t:3s"><circle r="1.8"/></g></g>
            <g transform="translate(82 205)"><g class="star" style="--i:10;--t:2.5s"><circle r="1.6"/></g></g>
            <g transform="translate(288 45)"><g class="star" style="--i:11;--t:3.6s"><circle r="1.4"/></g></g>
          </svg>

          <span class="shooting"></span>

          <span class="knob-track">
            <span class="halo"></span>
            <span class="knob">
              <span class="sun"></span>
              <span class="moon">
                <span class="crater c1"></span>
                <span class="crater c2"></span>
                <span class="crater c3"></span>
              </span>
            </span>
          </span>

          <!-- Clouds: three layers, back (blue) → front (near white). Each is a cluster of circles. -->
          <svg class="cloud cloud-1" viewBox="0 0 530 243" aria-hidden="true">
            <g fill="var(--cloud-1)">
              <circle cx="230" cy="232" r="42"/>
              <circle cx="310" cy="205" r="48"/>
              <circle cx="388" cy="172" r="54"/>
              <circle cx="462" cy="110" r="70"/>
              <circle cx="528" cy="48"  r="72"/>
              <circle cx="480" cy="262" r="100"/>
              <circle cx="540" cy="150" r="60"/>
            </g>
          </svg>
          <svg class="cloud cloud-2" viewBox="0 0 530 243" aria-hidden="true">
            <g fill="var(--cloud-2)">
              <circle cx="180" cy="248" r="40"/>
              <circle cx="262" cy="228" r="44"/>
              <circle cx="345" cy="212" r="46"/>
              <circle cx="428" cy="180" r="54"/>
              <circle cx="505" cy="118" r="66"/>
              <circle cx="548" cy="62"  r="58"/>
              <circle cx="500" cy="252" r="90"/>
            </g>
          </svg>
          <svg class="cloud cloud-3" viewBox="0 0 530 243" aria-hidden="true">
            <g fill="var(--cloud-3)">
              <circle cx="118" cy="268" r="42"/>
              <circle cx="200" cy="254" r="42"/>
              <circle cx="285" cy="246" r="44"/>
              <circle cx="370" cy="238" r="46"/>
              <circle cx="452" cy="208" r="52"/>
              <circle cx="530" cy="150" r="66"/>
              <circle cx="510" cy="262" r="85"/>
            </g>
          </svg>
        </span>

        <span class="sr-only">تغییر حالت روشن و تیره</span>
      </button>
      <p class="hint">روی کیف پول کلیک کنید</p>
    </header>

    <footer class="credits-sig" dir="ltr">
      <a class="sig-start" href="https://hamzeh.framer.ai" target="_blank" rel="noopener">© 2026 <strong>Hamzeh</strong></a>
      <span class="sig-mid">Powered by <strong>Claude</strong></span>
      <span class="sig-end">
        <a href="https://github.com/HamzehGhoreyshi/blue-bank-cards-animation" target="_blank" rel="noopener" aria-label="Source code on GitHub, by HamzehGhoreyshi">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <strong>HamzehGhoreyshi</strong>
        </a>
        <span class="dot" aria-hidden="true">·</span>
        <a class="stars-item" href="https://github.com/HamzehGhoreyshi/blue-bank-cards-animation" target="_blank" rel="noopener" aria-label="Star this project on GitHub">
          <svg class="star-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.751.751 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
          <strong class="star-count">Star</strong>
        </a>
      </span>
    </footer>

    <script type="module" src="/src/theme.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
